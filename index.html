    <script>
        // Preloader Logic
        // The preloader is completely hidden by default in CSS to prevent the 0.1s flash on fast reloads.
        const preloader = document.getElementById('preloader');
        
        let loaderTimeout = setTimeout(() => {
            // Only if the page takes longer than 150ms to load, show the loader.
            preloader.classList.add('show');
        }, 150);

        window.addEventListener('load', () => {
            clearTimeout(loaderTimeout); // Cancel the "show" timer if it loaded fast
            preloader.classList.remove('show');
            setTimeout(() => {
                preloader.style.display = 'none'; // Completely remove from DOM flow after fade out
            }, 300);
        });

        // Theme Toggle Logic
        const themeToggle = document.getElementById('themeToggle');
        
        // Match checkbox state to the theme that was already set at the top of the body
        if (document.body.classList.contains('light-mode')) {
            themeToggle.checked = false; // Left side (Day) = Light Mode
        } else {
            themeToggle.checked = true; // Right side (Night) = Default Dark Mode
        }
        
        // Remove preload class after a tiny delay so initial theme application doesn't transition
        setTimeout(() => {
            document.body.classList.remove('preload');
        }, 50);

        themeToggle.addEventListener('change', () => {
            if (themeToggle.checked) {
                // Checked means Night / Dark Mode
                document.body.classList.remove('light-mode');
                localStorage.setItem('theme', 'dark');
            } else {
                // Unchecked means Day / Light Mode
                document.body.classList.add('light-mode');
                localStorage.setItem('theme', 'light');
            }
        });
    </script>
